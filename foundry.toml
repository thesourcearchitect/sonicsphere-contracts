[profile.default]
src      = "src"
out      = "out"
libs     = ["lib"]
test     = "test"
script   = "script"
cache    = true
optimizer = true
optimizer_runs = 200
solc     = "0.8.25"
evm_version = "cancun"

[profile.default.fmt]
line_length     = 100
tab_width       = 4
bracket_spacing = true

# Coverage profile: disable optimizer so line/branch counts are accurate
[profile.coverage]
optimizer = false
via_ir    = false

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base         = "${BASE_MAINNET_RPC_URL}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532, url = "https://api.etherscan.io/v2/api?chainid=84532" }
base         = { key = "${BASESCAN_API_KEY}", chain = 8453,  url = "https://api.etherscan.io/v2/api?chainid=8453" }
