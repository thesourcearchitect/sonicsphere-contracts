name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FOUNDRY_PROFILE: default

jobs:
  check:
    name: Foundry CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Check formatting
        run: forge fmt --check

      - name: Build contracts
        run: forge build --sizes

      - name: Run unit and edge-case tests
        run: forge test --no-match-contract LiquidityVaultInvariant -vvv

      - name: Run invariant tests (extended runs)
        run: forge test --match-contract LiquidityVaultInvariant --fuzz-runs 1024 -vvv

      - name: Check gas snapshot
        run: forge snapshot --check

      - name: Generate coverage report
        run: forge coverage --report lcov --report-file coverage/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
